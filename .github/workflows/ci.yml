name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - if: matrix.os == 'ubuntu-latest'
        run: npm run lint

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Firefox Developer Edition (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/firefox.tar.xz" "https://download.mozilla.org/?product=firefox-devedition-latest-ssl&os=linux64&lang=en-US"
          tar -xJf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP"
          echo "FIREFOX_BIN=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"
      - name: Install Firefox Developer Edition (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.mozilla.org/?product=firefox-devedition-latest-ssl&os=win64&lang=en-US" -OutFile "$env:RUNNER_TEMP\firefox.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\firefox.exe" -ArgumentList "/S" -Wait
          "FIREFOX_BIN=C:\Program Files\Firefox Developer Edition\firefox.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm run install-host -- --no-claude
      - name: Diagnose the iframe race (temporary)
        shell: bash
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/patch.mjs" <<'EOF'
          import fs from "node:fs";
          const root = process.argv[2];
          const nav = `${root}/extension/background/navigation.js`;
          let s = fs.readFileSync(nav, "utf8").replace(/\r\n/g, "\n");
          s = s.replace("const [expected, navigating] = counted?.[0] ?? [];", "const [expected, navigating] = counted?.[0] ?? [];\n  globalThis.__fs = { counted, start: Date.now() };");
          s = s.replace("const children = frames?.filter((f) => f.parentFrameId === 0);", "const children = frames?.filter((f) => f.parentFrameId === 0);\n    globalThis.__fs.children = children?.map((f) => [f.frameId, f.url]); globalThis.__fs.waited = Date.now() - globalThis.__fs.start;");
          fs.writeFileSync(nav, s);
          const content = `${root}/extension/background/content.js`;
          let c = fs.readFileSync(content, "utf8").replace(/\r\n/g, "\n");
          c = c.replace("      } catch {\n        const tab = await api.tabs.get(tabId);\n        throw new Error(`Cannot access this page (${tab.url}): Firefox does not allow extensions here.`);",
            "      } catch (e2) {\n        const tab = await api.tabs.get(tabId);\n        const frames = await api.webNavigation.getAllFrames({ tabId }).catch(() => []);\n        throw new Error(`Cannot access this page (${tab.url}): Firefox does not allow extensions here. DEBUG send=${err?.message} inject=${e2?.message} now=${JSON.stringify(frames.map((f) => [f.frameId, f.url]))} settled=${JSON.stringify(globalThis.__fs)} sinceSettled=${Date.now() - (globalThis.__fs?.start ?? 0)}`);");
          fs.writeFileSync(content, c);
          if (!s.includes("__fs") || !c.includes("DEBUG")) throw new Error("patch failed");
          console.log("patched");
          EOF
          cat > "$RUNNER_TEMP/frames.mjs" <<'EOF'
          import { pathToFileURL } from "node:url";
          const { startHarness, textOf } = await import(pathToFileURL(process.argv[2]).href);
          const loops = Number(process.argv[3] ?? 30);
          const h = await startHarness();
          try {
            await h.call("tabs_context", { createIfEmpty: true });
            let failures = 0;
            for (let i = 0; i < loops; i++) {
              const tabId = Number(/Created tab (\d+)/.exec(textOf(await h.call("tabs_create")))[1]);
              const t0 = Date.now();
              await h.call("navigate", { tabId, url: `${h.fixtures.a}/frames.html?b=${encodeURIComponent(h.fixtures.b)}&i=${i}` });
              const t1 = Date.now();
              const text = textOf(await h.call("read_page", { tabId }));
              const t2 = Date.now();
              if (!/Frame button/.test(text)) {
                failures++;
                console.log(`#${i} FAILED navigate ${t1 - t0} ms, read_page ${t2 - t1} ms\n${/note "([^\n]*)/.exec(text)?.[1]}`);
                const start = Date.now();
                let ok = false;
                while (!ok && Date.now() - start < 10_000) {
                  await new Promise((r) => setTimeout(r, 100));
                  ok = /Frame button/.test(textOf(await h.call("read_page", { tabId })));
                }
                console.log(`  read_page ${ok ? "succeeded" : "still failing"} ${Date.now() - start} ms later`);
              } else if (i < 3) console.log(`#${i} ok navigate ${t1 - t0} ms, read_page ${t2 - t1} ms`);
              await h.call("tabs_close", { tabId });
            }
            console.log(`failures ${failures}/${loops}`);
          } finally {
            await h.close();
          }
          EOF
          node "$RUNNER_TEMP/patch.mjs" "$GITHUB_WORKSPACE"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1920x1080x24" node "$RUNNER_TEMP/frames.mjs" "$GITHUB_WORKSPACE/test/e2e/harness.js" 40 || true; else node "$RUNNER_TEMP/frames.mjs" "$GITHUB_WORKSPACE/test/e2e/harness.js" 40 || true; fi
          git checkout -- extension/background
      # Firefox opens windows maximized on screens smaller than 1280x1040, and with no window manager resize_window cannot restore them.
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run e2e
      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: npm run e2e
