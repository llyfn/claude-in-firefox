name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - if: matrix.os == 'ubuntu-latest'
        run: npm run lint

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Firefox Developer Edition (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/firefox.tar.xz" "https://download.mozilla.org/?product=firefox-devedition-latest-ssl&os=linux64&lang=en-US"
          tar -xJf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP"
          echo "FIREFOX_BIN=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"
      - name: Install Firefox Developer Edition (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.mozilla.org/?product=firefox-devedition-latest-ssl&os=win64&lang=en-US" -OutFile "$env:RUNNER_TEMP\firefox.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\firefox.exe" -ArgumentList "/S" -Wait
          "FIREFOX_BIN=C:\Program Files\Firefox Developer Edition\firefox.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Diagnostics before e2e
        shell: bash
        run: |
          npx --no -- node -e "console.log('npm_execpath under npx:', process.env.npm_execpath)"
          ls -la "$FIREFOX_BIN" || true
          if [ "$RUNNER_OS" = Linux ]; then "$FIREFOX_BIN" --version; file "$RUNNER_TEMP/firefox.tar.xz"; else ls "/c/Program Files"; fi
      - run: npm run install-host -- --no-claude
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e
      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: npm run e2e
      - name: Diagnostics after e2e (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process -Filter "Name='node.exe' OR Name='cmd.exe' OR Name='firefox.exe'" | Select-Object ProcessId, ParentProcessId, CommandLine | Format-List
          reg query "HKCU\Software\Mozilla\NativeMessagingHosts\claude_firefox_bridge"
          Get-Content "$env:LOCALAPPDATA\claude-in-firefox\native-host.cmd"
          Get-Content "$env:LOCALAPPDATA\claude-in-firefox\claude_firefox_bridge.json"
