name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - if: matrix.os == 'ubuntu-latest'
        run: npm run lint

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Firefox Developer Edition (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/firefox.tar.xz" "https://download.mozilla.org/?product=firefox-devedition-latest-ssl&os=linux64&lang=en-US"
          tar -xJf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP"
          echo "FIREFOX_BIN=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"
      - name: Install Firefox Developer Edition (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.mozilla.org/?product=firefox-devedition-latest-ssl&os=win64&lang=en-US" -OutFile "$env:RUNNER_TEMP\firefox.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\firefox.exe" -ArgumentList "/S" -Wait
          "FIREFOX_BIN=C:\Program Files\Firefox Developer Edition\firefox.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Diagnostics before e2e
        shell: bash
        run: |
          npx -c 'node -e "console.log(process.env.npm_execpath)"' || true
          ls -la "$FIREFOX_BIN" || true
          if [ "$RUNNER_OS" = Linux ]; then "$FIREFOX_BIN" --version; file "$RUNNER_TEMP/firefox.tar.xz"; else ls "/c/Program Files"; fi
      - run: npm run install-host -- --no-claude
      - name: Diagnostics resize (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/diag.mjs" <<EOF
          import { startHarness, textOf } from "$GITHUB_WORKSPACE/test/e2e/harness.js";
          const h = await startHarness();
          try {
            await h.call("tabs_context", { createIfEmpty: true });
            const tabId = Number(/Created tab (\d+)/.exec(textOf(await h.call("tabs_create")))[1]);
            await h.call("navigate", { tabId, url: h.fixtures.a + "/basic.html" });
            const context = await h.bidi.contextOf("/basic.html");
            const sizes = "JSON.stringify({ outer: [outerWidth, outerHeight], inner: [innerWidth, innerHeight], screen: [screen.width, screen.height, screen.availWidth, screen.availHeight, screen.colorDepth] })";
            console.log("before", await h.bidi.evaluate(context, sizes));
            const t = Date.now();
            const r = await h.call("resize_window", { tabId, width: 1280, height: 900 });
            console.log("resize took", Date.now() - t, "ms:", textOf(r));
            console.log("after", await h.bidi.evaluate(context, sizes));
          } finally {
            await h.close();
          }
          EOF
          echo "--- default xvfb-run screen"
          xvfb-run -a node "$RUNNER_TEMP/diag.mjs" || true
          echo "--- 1920x1080x24 screen"
          xvfb-run -a -s "-screen 0 1920x1080x24" node "$RUNNER_TEMP/diag.mjs" || true
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run e2e
      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: npm run e2e
      - name: Diagnostics after e2e (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process -Filter "Name='node.exe' OR Name='cmd.exe' OR Name='firefox.exe'" | Select-Object ProcessId, ParentProcessId, CommandLine | Format-List
          reg query "HKCU\Software\Mozilla\NativeMessagingHosts\claude_firefox_bridge"
          Get-Content "$env:LOCALAPPDATA\claude-in-firefox\native-host.cmd"
          Get-Content "$env:LOCALAPPDATA\claude-in-firefox\claude_firefox_bridge.json"
